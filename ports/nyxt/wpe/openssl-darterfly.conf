# Native shared-libsa target. No Linux ABI or assembler CPU dispatch.
my %targets = (
    "darterfly-x86_64" => {
        inherit_from => [ "BASE_unix" ],
        CC => "clang",
        CFLAGS => "-O2 -ffunction-sections -fdata-sections",
        thread_scheme => "pthreads",
        bn_ops => "SIXTY_FOUR_BIT_LONG",
        sys_id => "DARTERFLY",
    },
);
